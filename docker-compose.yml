services:
  recorder:
    build: .
    command: python -m fathom.recorder
    restart: always
    env_file: [.env]
    environment: { FATHOM_DB: /data/fathom.db }
    volumes: [fathomdata:/data]
  api:
    build: .
    command: python -m fathom.api
    restart: always
    env_file: [.env]
    environment: { FATHOM_DB: /data/fathom.db, FATHOM_EXPORT_DIR: /data/export }
    ports: ["8000:8000"]
    volumes: [fathomdata:/data]
volumes:
  fathomdata:
